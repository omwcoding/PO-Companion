name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  issues: write
  contents: read
  pages: write      # Richiesto per il deploy su GitHub Pages
  id-token: write   # Richiesto per l'autenticazione OIDC di GitHub Pages

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' # ⚡ OTTIMIZZAZIONE: Attiva la cache di npm per velocizzare l'installazione

      - name: Installa dipendenze
        run: npm ci # ⚡ OTTIMIZZAZIONE: Installazione pulita e riproducibile

      - name: Esegui Controllo Tipi (TypeScript)
        # Esegue vue-tsc per scansionare TUTTO il progetto e salva i risultati
        run: |
          npx vue-tsc -b --force > raw-ts-report.txt || true

      - name: Esegui Linter (ESLint)
        # Esegue ESLint e salva i risultati
        run: |
          npx eslint . --format stylish > raw-eslint-report.txt || true

      - name: Genera Report Unificato
        run: |
          # Inizializza il file finale
          echo "### ⚠️ Report di Stato del Progetto" > lint-report.txt
          echo "Generato automaticamente ad ogni push per monitorare la salute del codice." >> lint-report.txt
          echo "" >> lint-report.txt
          
          # Se ci sono errori di tipo
          if [ -s raw-ts-report.txt ]; then
            echo "#### 🟦 Errori di Tipo TypeScript (vue-tsc)" >> lint-report.txt
            echo '```text' >> lint-report.txt
            cat raw-ts-report.txt >> lint-report.txt
            echo '```' >> lint-report.txt
            echo "" >> lint-report.txt
          fi
          
          # Se ci sono errori di linter
          if [ -s raw-eslint-report.txt ]; then
            echo "#### 🟩 Errori di Stile & Linter (ESLint)" >> lint-report.txt
            echo '```text' >> lint-report.txt
            cat raw-eslint-report.txt >> lint-report.txt
            echo '```' >> lint-report.txt
            echo "" >> lint-report.txt
          fi

      - name: Gestisci l'Issue del Linter su GitHub
        # Questo step gira solo sui push diretti su main (non sulle PR o altre branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list --search "Linter Report" --state open --json number --jq '.[0].number')

          # Se c'è almeno un errore in uno dei due report
          if [ -s raw-ts-report.txt ] || [ -s raw-eslint-report.txt ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue edit "$ISSUE_NUMBER" --body-file lint-report.txt
              echo "Issue #$ISSUE_NUMBER aggiornata."
            else
              gh issue create --title "Linter Report" --body-file lint-report.txt
              echo "Nuova issue creata."
            fi
          else
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue close "$ISSUE_NUMBER" --comment "Ottimo lavoro! Tutti gli errori di compilazione e linting sono stati risolti. 🎉"
              echo "Issue #$ISSUE_NUMBER chiusa."
            else
              echo "Nessun errore trovato."
            fi
          fi

      # 🚀 Esegui la build di produzione vera e propria (si assicura che il codice sia intatto per il deploy)
      - name: Verifica Compilazione (Build)
        run: npm run build

      # 📦 Carica i file compilati di Vite per il deploy (avviene solo su push su main)
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # La cartella con la build creata da npm run build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ci # Eseguiamo il deploy solo se il job di integrazione (ci) ha avuto successo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4